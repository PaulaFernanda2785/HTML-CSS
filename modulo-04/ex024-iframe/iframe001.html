<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estudo de iframe</title>
</head>
<style>
    iframe{
        width: 200px;
        height: 200px;
    }
</style>
<body>
    <h1>Testando o uso de um iframe</h1>
    <p>Acessando o site do 

    <iframe src="https://cursoemvideo.com" frameborder="0" height="500" width="1000">
        <a href="https://cursoemvideo.com" target="_blank">cursoemvideo</a><!--texto com link alternativo pra quando o navegador não aceitar iframe-->
    </iframe>

    para aprender a programar</p>

    <p>Site do <iframe src="https://www.google.com" frameborder="0">
        <a href="https://www.google.com/">google</a><!--texto com link alternativo pra quando o navegador não aceitar iframe-->
    </iframe> é muito legal</p> <!--Site protegido. não aparece no iframe!-->

    <iframe src="https://portal.inmet.gov.br" frameborder="0"></iframe>
</body>
</html>
