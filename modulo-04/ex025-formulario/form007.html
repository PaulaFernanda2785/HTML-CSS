<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>
        Exemplo de Formulário
    </h1>
    <form action="cadastro.php" method="post" autocomplete="on">
        <fieldset>
            <legend>Formulário</legend>
            <p>
                <label for="iest">Estado</label>
                <select name="estado" id="iest">
                    <option value="" selected>---Escolha um Estado---</option>
                    <optgroup label="Região Sudeste">
                        <option value="MG">Minas gerais </option>
                        <option value="RJ">Rio de Janeiro</option>
                        <option value="SP">São Paulo</option>
                    </optgroup>

                    <optgroup label="Região Nordeste">
                        <option value="MA">Maranhão</option>
                        <option value="PE">Pernanbuco</option>
                        <option value="RN">Rio Grande do Norte</option>
                    </optgroup>
                </select>
            </p>

            <p>
                <label for="iprof">Profissão</label>
                <input type="text" name="prof" id="iprof" list="listprof" placeholder="Escolhas a sua profissão">
                <datalist id="listprof">
                    <option>Administrador</option>
                    <option>Contabilidade</option>
                    <option>Desenvolvedor</option>
                    <option>Professor</option>
                </datalist>
            </p>

            <p>
                <label for="imag">Mensagem</label> <br>
                <textarea name="mag" id="imag" cols="30" rows="5" placeholder="Escreva a sua mensagem aqui"></textarea>
            </p>


        </fieldset>

        <p>
            <input type="submit" value="Enviar">
            <input type="reset" value="Limpar">
        </p>




    </form>
</body>
</html>
