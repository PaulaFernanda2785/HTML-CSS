<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexble Box</title>
    <style>
        div.conteiner{
            display: flex;
            background-color: aqua;
            flex-flow: row nowrap;
        }

        div.item{
            background-color: beige;
            text-align: center;
            border: 1px solid black;
            flex-basis: 200px;
        }

        #i1{
            flex-shrink: 2;
            flex-grow: 0;
        }
        #i2{
            flex-shrink: 1;
            flex-grow: 1;
        }
        #i3{
            flex-shrink: 2;
            flex-grow: 0;
        }

    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item" id="i1">A</div>
        <div class="item" id="i2">B</div>
        <div class="item" id="i3">C</div>
    </div>
</body>
</html>
