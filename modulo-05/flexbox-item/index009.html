<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexble Box</title>
    <style>
        div.conteiner{
            display: flex;
            background-color: aqua;
            flex-flow: row wrap;
        }

        div.item{
            background-color: beige;
            text-align: center;
            border: 1px solid black;
            flex-basis: 150px;
        }

    </style>
</head>
<body>
    <div class="conteiner">
        <div class="item" id="i1">A</div>
        <div class="item" id="i2">B conteudo </div>
        <div class="item" id="i3">C</div>
        <div class="item" id="i4">D</div>
        <div class="item" id="i5">E coteudo maior </div>
        <div class="item" id="i6">F</div>
        <div class="item" id="i7">G conteudo bem maior </div>
    </div>
</body>
</html>
