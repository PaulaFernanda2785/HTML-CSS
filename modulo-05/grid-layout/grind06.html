<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid</title>
    <style>
        div.container{
            display: grid;
            grid-template-rows: repeat(3,100px);
            grid-template-columns: repeat(4,1fr);
            gap: 20px; 
        }

        div.caixa01{
            border: 2px dashed blue;
            grid-area: 1 / 1 / 2 / 5;
        }

        div.caixa02{
            border: 2px dashed yellow;
            grid-area: 2 / 1 / 4 / 3;
        }

        div.caixa03{
            border: 2px dashed green;
            /* grid-row-start: 2;
            grid-row-end: 4;
            grid-column-start: 3;
            grid-column-end: 5;*/

            grid-area: 2 / 3 / 4 / 5;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="caixa01">caixa01</div>
        <div class="caixa02">caixa02</div>
        <div class="caixa03">caixa03</div>
    </div>
</body>
</html>
