<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>desafio002</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            font-family: Arial, Helvetica, sans-serif;
            box-sizing: border-box;
        }

        div.container{
            display: grid;
            grid-template-rows:200px 100px 1fr 100px;
            grid-template-columns: 1fr 500px;
            height: 100vh;
        }

        header#topo{
            background-color: aqua;
            grid-area: 1 / 1 / 2 / 3;
        }

        nav#menu{
            background-color: antiquewhite;
            grid-area: 2 / 1 / 3 / 3;
        }

        main#principal{
            background-color: chocolate;
            grid-area: 3 / 1 / 4 / 2;
            display: grid;
            grid-template-rows: repeat(3, 1fr);
            grid-template-columns: 1fr;
        }



        article#secundario{
            background-color:blue;
            grid-area: 3 / 2 / 4 / 3;
        }

        footer#rodape{
            background-color: brown;
            grid-area: 4 / 1 / 5 / 3;
        }
    </style>
</head>
<body>
    <div class="container">
        <header id="topo">
            <h1>
                Titulo
            </h1>
        </header>
        <nav id="menu">
            <li>Home</li>
            <li>Sobre</li>
            <li>Contatos</li>
        </nav>
        <main id="principal">
            <section>
                <h2>
                    Home
                </h2>
            </section>
            <section>
                <h2>
                    Sobre
                </h2>
            </section>
            <section>
                <h2>
                    Contato
                </h2>
            </section>
        </main>
        <article id="secundario">
                <h2>
                    Artigos
                </h2>
            </article>
        <footer id="rodape">
            Rodapé
        </footer>
    </div>
</body>
</html>
