<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>desavio001</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 1em;
            color: black;
            font-weight: 600;
        }

        div.container{
            border: 2px solid black;
            height: 100vh;
            display: grid;
            grid-template-rows: 1fr 100px 2fr 100px;
            grid-template-columns: repeat(2, 1fr) 20%;
            
        }

        div.topo{
            background-color: blue;
            grid-area: 1 / 1 / 2 / 4;
            text-align: center;
        }

        div.menu{
            background-color: red;
            grid-area: 2 / 1 / 3 / 4;
            text-align: center;
        }

        div.principal{
            background-color: aqua;
            grid-area: 3 / 1 / 4 / 3;
            text-align: center;
        }

        div.secundario{
            background-color: blueviolet;
            grid-area: 3 / 3 / 4 / 4;
            text-align: center;
        }

        div.rodape{
            background-color: gray;
            grid-area: 4 / 1 / 5 / 4;
            text-align: center;
        }

    </style>
</head>
<body>
    <div class="container">
        <div class="topo">topo</div>
        <div class="menu">menu</div>
        <div class="principal">principal</div>
        <div class="secundario">secundario</div>
        <div class="rodape">rodape</div>
    </div>
</body>
</html>
