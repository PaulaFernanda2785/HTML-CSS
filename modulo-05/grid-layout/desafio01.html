<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>desavio001</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            box-sizing: border-box;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 1em;
            color: black;
            font-weight: 600;
        }

        div.container{
            background-color: black;
            height: 100vh;
            width: 100vw;
            display: grid;
            grid-template-rows: 100px 100px 1fr 100px;
            grid-template-columns: 3fr 1fr;
            gap: 5px;
            
        }

        header.topo{
            background-color: blue;
            grid-area: 1 / 1 / 2 / 3;
            text-align: center;
        }

        nav.menu{
            background-color: red;
            grid-area: 2 / 1 / 3 / 3;
            text-align: center;
        }

        main.principal{
            background-color: aqua;
            grid-area: 3 / 1 / 4 / 2;
            text-align: center;
        }

        article.secundario{
            background-color: blueviolet;
            grid-area: 3 / 2 / 4 / 3;
            text-align: center;
        }

        footer.rodape{
            background-color: gray;
            grid-area: 4 / 1 / 5 / 3;
            text-align: center;
        }

    </style>
</head>
<body>
    <div class="container">
        <header class="topo">topo</header>
        <nav class="menu">menu</nav>
        <main class="principal">principal</main>
        <article class="secundario">secundario</article>
        <footer class="rodape">rodape</footer>
    </div>
</body>
</html>
